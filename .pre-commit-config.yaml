minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: sql-reference
        name: generated SQL function reference
        entry: cargo run -p vql-kernel --example generate_sql_reference --locked -- --check
        language: system
        files: ^(Cargo\.(toml|lock)|vql-kernel/(Cargo\.toml|src/.*\.rs|examples/generate_sql_reference\.rs)|docs/user_guide/sql-functions\.md)$
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        files: (^|/)(Cargo\.(toml|lock)|rust-toolchain\.toml|.*\.rs)$
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        files: (^|/)(Cargo\.(toml|lock)|rust-toolchain\.toml|.*\.rs)$
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --locked
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
