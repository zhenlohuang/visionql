name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  check:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libclang-dev \
            libswresample-dev \
            libswscale-dev \
            perl \
            pkg-config

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate development services
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check generated SQL function reference
        run: cargo run -p vql-kernel --example generate_sql_reference --locked -- --check

  coverage:
    name: Rust tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libclang-dev \
            libswresample-dev \
            libswscale-dev \
            perl \
            pkg-config

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests and generate coverage report
        run: >-
          cargo llvm-cov
          --workspace
          --exclude vql-python
          --locked
          --no-cfg-coverage
          --html

      - name: Export LCOV report
        run: >-
          cargo llvm-cov report
          --ignore-filename-regex '/vql-python/'
          --lcov
          --output-path target/llvm-cov/lcov.info

      - name: Add coverage summary
        run: |
          echo '### Rust test coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report \
            --ignore-filename-regex '/vql-python/' \
            --summary-only \
            | awk 'NR == 1 || /^TOTAL/' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: rust-coverage
          path: |
            target/llvm-cov/html
            target/llvm-cov/lcov.info
          if-no-files-found: error
          retention-days: 7

  python-api:
    name: Python API
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libclang-dev \
            libswresample-dev \
            libswscale-dev \
            perl \
            pkg-config

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Build and test the Python API
        working-directory: vql-python
        run: |
          python -m pip install "maturin>=1.9,<2" pytest pytest-cov pyarrow
          maturin build --locked --out ../target/wheels
          python -m pip install ../target/wheels/*.whl
          cd ..
          python -m pytest -q \
            --cov=visionql \
            --cov-report=term-missing \
            --cov-report=xml:target/python-coverage.xml \
            vql-python/tests

      - name: Upload Python coverage
        uses: actions/upload-artifact@v6
        with:
          name: python-coverage
          path: target/python-coverage.xml
          if-no-files-found: error
          retention-days: 7
