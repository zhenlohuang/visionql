name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: CI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install FFmpeg development libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            ffmpeg \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libclang-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install pinned Rust toolchain
        run: rustc --version --verbose

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: vql-python/pyproject.toml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Python wheel
        run: |
          python -m pip install "maturin>=1.9,<2" pytest
          maturin build --manifest-path vql-python/Cargo.toml --profile dev --locked
          python -m pip install target/wheels/visionql-*.whl

      - name: Test Python API
        run: pytest -q vql-python/tests
