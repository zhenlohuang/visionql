name: ci

on:
  push:
  pull_request:

env:
  VQL_HOME: ./data/.vql

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  python-wheel:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install maturin pytest pyarrow
      - run: maturin build --manifest-path vql-python/Cargo.toml --locked
      - run: python -m pip install target/wheels/visionql-*.whl
      - run: pytest -q vql-python/tests
