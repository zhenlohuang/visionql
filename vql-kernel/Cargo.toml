[package]
name = "vql-kernel"
description = "Embedded batch and streaming query kernel for VisionQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["ffmpeg-native"]
ffmpeg-native = ["dep:ffmpeg-next"]

[dependencies]
arrow.workspace = true
arrow-schema.workspace = true
async-stream.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
datafusion.workspace = true
ffmpeg-next = { workspace = true, optional = true }
fast_image_resize.workspace = true
futures.workspace = true
image.workspace = true
object_store.workspace = true
ort.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rdkafka.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
vql-catalog = { path = "../vql-catalog", default-features = false, features = ["sqlite"] }
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }

[dev-dependencies]
libtest-mimic.workspace = true
sqllogictest.workspace = true
tempfile.workspace = true

[[test]]
name = "slt"
path = "tests/slt.rs"
harness = false
