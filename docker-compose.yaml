services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.0
    environment:
      MTX_RTSPTRANSPORTS: tcp
    ports:
      - "${VQL_RTSP_PORT:-8554}:8554"

  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "${VQL_KAFKA_PORT:-9092}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${VQL_KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  vqld:
    build:
      context: .
    environment:
      VQLD_FLIGHT_ADDR: 0.0.0.0:6031
      VQLD_SERVICE_TOKEN: "${VQLD_SERVICE_TOKEN:-vql-system-test-token}"
      VQLD_TLS_CERT: /run/vqld-tls/server.crt
      VQLD_TLS_KEY: /run/vqld-tls/server.key
    ports:
      - "${VQLD_FLIGHT_PORT:-6031}:6031"
    volumes:
      - vqld-home:/var/lib/visionql
      - type: bind
        source: "${VQLD_TLS_DIR:-./data/.vqld-system-test/tls}"
        target: /run/vqld-tls
        read_only: true

volumes:
  vqld-home:
