[workspace]
members = ["backend"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/zhenlohuang/visionql"

[workspace.dependencies]
arrow = "=58.3.0"
arrow-flight = { version = "=58.3.0", features = ["flight-sql", "tls-ring"] }
axum = "0.8"
bytes = "1"
clap = { version = "4.5.48", features = ["derive", "env"] }
futures = "0.3.31"
prost = "0.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14.1", features = ["tls-ring"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
uuid = { version = "1", features = ["v4"] }
